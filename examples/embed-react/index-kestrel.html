<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GenOffice Embed — Kestrel demo (React)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; max-width: 1100px; }
    h1 { font-size: 22px; margin: 0 0 8px; }

    .row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; margin-bottom: 8px; align-items: center; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-top: 8px; }
    .controls { display: flex; gap: 8px; margin: 8px 0; }
    button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; }
    ul { padding-left: 20px; }
    li.resolved { text-decoration: line-through; color: #888; }
    li { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    table { border-collapse: collapse; }
    td { padding: 4px 8px; border-bottom: 1px solid #eee; font-size: 12px; }
  </style>
