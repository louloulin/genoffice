name: Docs

# Build the VitePress docs site and deploy to GitHub Pages on push to main.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        working-directory: docs
      # Typedoc-count explicit step (sdk1.md §11.34.4 + §A.5 backlog).
      # `docs:build` already runs gen-typedoc.mjs; this step surfaces
      # the count + asserts the bounds [200, 400] from
      # apps/web-server/tests/typedoc-count.test.ts as visible CI log
      # output rather than relying on the embedded vitest assertion.
      # The drift between printed value and the [200, 400] window is
      # what reviewers should watch — see §A.5 typedoc-count note.
      - name: Assert typedoc output count is within bounds
        working-directory: .
        run: |
          set -euo pipefail
          node docs/scripts/gen-typedoc.mjs
          count=$(find docs/api/_generated -name '*.md' | wc -l | tr -d ' ')
          echo "[typedoc-count] generated $count .md files (bounds: 200-400)"
          if [ "$count" -lt 200 ] || [ "$count" -gt 400 ]; then
            echo "::error::typedoc output count $count is outside [200, 400]"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
