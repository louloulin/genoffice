name: CI

# typecheck + test + lint on every push and PR. Required gate for `release.yml`.

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # The repo's top-level `test` script fans out across every package
      # and app that ships a `test` script. Long-running packages are
      # already excluded via `--if-present`.
      - run: npm test

  build:
    name: Build Web SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # Build the standalone SDK bundle (the artefact that ships to npm).
      - run: npm run build -w @genoffice/sdk --if-present

  bundle:
    name: Bundle Web Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # Bundle the web-server into a single 28 MB artefact — used by the
      # Docker image and the standalone npm package.
      - run: npm run bundle -w @genoffice/web-server --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: web-server-bundle
          path: apps/web-server/dist/bundle/index.js
          retention-days: 7

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, bundle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/genoffice/web-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          REGISTRY: ghcr.io
