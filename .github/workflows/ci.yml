name: CI

# typecheck + test + lint on every push and PR. Required gate for `release.yml`.

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      # 静态门禁：四格式翻译对等、翻译副本落点、术语/记忆面板接线。
      # 三者都检查「声明与源码是否一致」，且**失败不报错到用户可见处**的缺陷
      # （面板静默不可用、副本被当原地保存），所以必须与 lint 同级常驻。
      - run: npm run check:app-translation
      - run: npm run check:translation-copy-save
      - run: npm run check:translation-storage-panel
      - run: npm run check:pdf-editable-docx
      # 嵌入宿主时 AI base URL 必须带部署路径前缀：漏了只在那一种部署形态下 404，
      # 编译与单测都绿，必须与其它静态门禁同级常驻。
      - run: npm run check:embed-ai-base-prefix
      # 嵌入宿主时宿主文档必须「真的被打开」且保存「真的推回云盘」：bridge 与 App
      # 之间只隔一个 DOM 事件，任一端漏掉都是静默的空文档 / 静默的不落盘，
      # 编译与单测都绿，只能靠门禁。
      - run: npm run check:embed-host-documents
      # 打开工作簿时必须补齐 schema 默认的 sheet 数组：缺一个就在 Univer 命令
      # 处理器内部抛错，异常从 FRange.setValue 逃出调用方循环，同批次后续写入全部
      # 丢失（实测 6 个单元格只落 1 个译文且提示成功）。编译与单测都看不出来。
      - run: npm run check:sheets-model-defaults

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # The repo's top-level `test` script fans out across every package
      # and app that ships a `test` script. Long-running packages are
      # already excluded via `--if-present`.
      - run: npm test

  build:
    name: Build Web SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # Build the standalone SDK bundle (the artefact that ships to npm).
      # The package is `@genoffice/web-sdk` — the old `-w @genoffice/sdk`
      # plus `--if-present` resolved to nothing, so this built silently.
      - run: npm run build -w @genoffice/web-sdk

  bundle:
    name: Bundle Web Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      # Bundle the web-server into a single 28 MB artefact — used by the
      # Docker image and the standalone npm package. This also builds the host
      # SDK and stages it at dist/static/sdk/, so the bundle step has no hidden
      # prerequisite.
      - run: npm run bundle -w @genoffice/web-server --if-present
      # The staged SDK's entry list is a committed single source of truth that
      # the server's `/static/sdk/*` allow-list is derived from. Adding an
      # entry to the build without committing the regenerated manifest would
      # otherwise be a silent 404 for exactly the new entry.
      - run: npm run manifest:check -w @genoffice/web-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: web-server-bundle
          path: apps/web-server/dist/bundle/index.js
          retention-days: 7

  # The contract gate. The SDK's mocked suite once passed 410/410 while seven
  # methods failed against a real server, because the mocks served a payload
  # shape the server never emits. This job builds both artefacts, boots a
  # throwaway server on a free port and probes it over real HTTP. Breaking a
  # contract (a renamed query param, a moved route, a dropped scope) must
  # turn this job red.
  #
  # Deliberately not in `docker`'s `needs`: it only guards the workflow's
  # overall status, and adding ~4 minutes to the release path buys nothing.
  sdk-contract:
    name: SDK Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run verify:sdk

  # The image gate. `needs: [bundle]` is not enough to know the image is
  # usable: the released image once carried no `/static/sdk/*` and one renderer
  # out of seven, while every job above stayed green. Only running the image and
  # asking it for bytes over HTTP catches that (see tools/verify-image.mjs).
  #
  # Build loads the image locally and pushes nothing until it has been proven to
  # serve. Publishing first and verifying after would leave an unusable image in
  # the registry for however long the check takes to fail.
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, bundle]
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/genoffice/web-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The verification step below is a Node script; pin the interpreter rather
      # than relying on whatever `node` the runner image happens to carry.
      - uses: actions/setup-node@1d27c9d2b801d2c8c384b2cf4e0cd6f97f25990e5 # v6.4.0
        with:
          node-version: 22.12
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts the image with a shared secret, asserts every renderer route, the
      # SDK entries and the auth posture answer as claimed, then asserts the
      # image REFUSES to boot when WEB_SDK_BUNDLE_DIR points at nothing or when
      # it binds a public interface with no WEB_TOKEN. Non-zero exit fails this
      # job. A gate that cannot go red is not a gate.
      - name: Verify the image serves its artefacts
        run: node tools/verify-image.mjs "${{ env.IMAGE }}:${{ github.sha }}"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"
