        (ai:chat, ai:stream, /api/ai/stream, v1 ai:chat, v1 ai:skill, /api/ipc
        dispatcher); desktop main-process BYOK remains unrestricted by design."
      truncated: false
    - text: The /api/ipc dispatcher now runs JWT verification once per request for
        subject resolution, the same work the gate already did; no new secret
        material is logged or persisted.
      truncated: false
    - text: requireScopeFromHeaders (v1 + /api/ipc hard-scope channels) still reads
        the Bearer header only — that is the documented contract for scope
