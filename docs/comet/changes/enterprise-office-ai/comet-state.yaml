builder_handoff:
  candidate_id: 5a5d5402-e8d8-40d5-8031-139bab4fb6ee
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:50050450-5436-4a93-bbc3-5c4b5e14329d
  iteration: 2
  summary:
    text: >-
      Iteration 2 candidate: repairs the A2/A31 failures found by the
      iteration-1 Verifier, on top of the iteration-1 slice (A1 gate fail-closed
      + A2/A3 sanitize) which remains in place.


      [Root cause of the verify failure] Embed-vs-local detection and
      JWT-subject threading were Authorization-Bearer-only at three points,
      while the HTTP gate admits a JWT through all four credential transports
      (Bearer / X-GenOffice-Token / auth_token cookie / ?token=). A JWT caller
      whose credential arrived via any non-Bearer transport — or whose call was
      forwarded by the v1 REST layer, which synthesizes a userId-less IPC event
      — was misread as 'local operator' by settings-sanitize, so injected
      apiKey/baseUrl overrides were kept as if they were operator BYOK.


      [Fix — thread the verified JWT subject through every ingress]

      1. apps/web-server/src/auth/route-policy.ts: new export
      jwtPayloadFromRequest(request) =
      firstValidJwt(credentialCandidates(request)) — the verified JWT payload
      through ANY of the four transports, or null. Documented as the required
      primitive for caller-identity decisions.

      2. apps/web-server/src/index.ts, /api/ipc dispatcher: authPayload now =
      jwtPayloadFromRequest({headers, url}) instead of an Authorization-header
      slice; event.userId is set for cookie/?token=/X-GenOffice-Token JWT
      callers exactly as it already was for Bearer.

      3. apps/web-server/src/index.ts, POST /api/ai/stream: embedCaller now =
      jwtPayloadFromRequest(...) !== null (was Bearer-only). A cookie-JWT caller
      on a jwt-open boot (route table skipped) now lands in embed mode;
      previously it degraded to operator BYOK policy, where a loopback evil
      baseUrl + injected key would have been honored.

      4. apps/web-server/src/api/v1/ipc-bridge.ts: invokeIpc(channel, args,
      eventOverrides?) merges overrides into the synthesized event.

      5. apps/web-server/src/api/v1/ai.ts: handleAiChat and handleAiSkill pass {
      userId: gate.payload.sub } so REST-invoked ai:chat sees the embed identity
      (this was the exact path the Verifier exploited).


      [New proof] tests/ai-stream-ssrf-e2e.test.ts grows from 4 to 6 e2e, both
      in the JWT-only embed boot: (a) POST /api/v1/ai/chat (Bearer JWT, scope
      ai:chat, REST-shape body) with injected evil baseUrl+apiKey — upstream
      hits the server-configured endpoint carrying the server-held key; (b) POST
      /api/ipc/ai:chat with the JWT carried ONLY as an auth_token cookie and the
      same evil injection — same outcome. The pre-existing dual-listener
      assertions (evil listener zero hits across ALL scenarios, upstream
      Authorization === 'Bearer server-side-key') guard both.


      [Verification] typecheck clean; full vitest 1278 passed / 23 skipped (154
      files, sidecar fixture exclusion unchanged); npm run test:http 40/40;
      e2e/embed-loop-probe.mjs LOOP OK (11 invariants). Operator BYOK behavior
      unchanged (loopback override still honored, 169.254.169.254 still 400 with
      allowlist reason) — regression-checked by the same suite.
    truncated: false
  addressed_acceptance_ids:
    - A2
    - A31
