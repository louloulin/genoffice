      threading) remain in place.


      [Root cause of the iteration-2 verify failure] The translate HTTP pipeline
      (translateBatchCore / handleTranslateStreamHttp) resolved the provider
      straight from caller-supplied req.settings with no sanitize — injected
      apiKey/baseUrl flowed into translateBatch/translateBatchStream. Reachable
      from four ingresses: legacy POST /api/ai/translate, legacy POST
      /api/ai/translate/stream, v1 POST /api/v1/ai/translate (units[] branch),
      v1 POST /api/v1/ai/translate/stream. On jwt-open boots these legacy routes
      also had no per-route scope check (route table skipped by design), so even
      a files:read-only guest JWT could reach provider spend — the aggravating
      factor the Verifier flagged.


      [Fix — same sanitize contract as the chat surface, applied at the
      translate choke point]

      1. src/ai/translate-http.ts: pickSettings deleted; resolveProvider now
      runs sanitizeRequestSettings (embed: strip + backfill from persisted
      server settings; local/operator: BYOK kept, baseUrl must be
      loopback/allowlist) and returns a {ok:true, provider, config} | {ok:false,
      reason} union. New exported TranslateHttpCallerOptions {embedCaller}
      threaded through handleTranslateBatchHttp / translateBatchCore /
      handleTranslateStreamHttp; the HTTP header comment documents the contract.
      Rejection surfaces as 400 INVALID_ARGUMENT (non-stream, before writeHead)
      or an SSE error event (stream, after writeHead).

      2. src/index.ts: new gateLegacyJwtScope(request, url, response, scope)
      helper — enforces the route table's declared scope for verified JWT
      callers through ANY credential transport (closing the jwt-open gap;
      operators and open-mode local callers pass untouched) and returns the JWT
      payload so the route derives embedCaller from it. Wired on
      /api/ai/translate, /api/ai/translate/stream,
      /api/ai/translate/stream/cancel (scope ai:translate), /api/ai/stream and
      /api/ai/stream/cancel (scope ai:chat); the stream route now derives
      embedCaller from the same payload instead of a second JWT parse.

      3. src/api/v1/ai.ts: the v1 translate handlers pass {embedCaller: true}
      (their requireScopeFromHeaders gate has already verified a JWT) for both
      the units[] batch branch and the stream handler.

      4. Audit note: the IPC ai:translate / ai:translate-batch channels do NOT
      consume caller settings (single-source-of-truth inside the pi session), so
      no sanitize was needed there; the v1 single-text REST shape builds its IPC
      body from text/from/to only.


      [New proof] tests/ai-stream-ssrf-e2e.test.ts grows from 6 to 11 e2e:
      legacy translate batch (Bearer ai:translate) with evil injection routes
      upstream to the server-configured endpoint with the server-held key;
      legacy translate stream via cookie-carried JWT — same outcome; v1 units[]
      ingress — same; files:read-only JWT gets 403 on all three legacy
      provider-spend routes (translate batch, translate stream, /api/ai/stream);
      operator loopback BYOK override honored on the translate route; the global
      invariant (evil listener zero hits across ALL scenarios) guards
      everything. The pre-existing stream/chat tests were updated only where the
      new scope gate requires it (the /api/ai/stream embed test's JWT now
      carries ai:chat).


      [Verification] typecheck clean; full vitest 1283 passed / 23 skipped (154
