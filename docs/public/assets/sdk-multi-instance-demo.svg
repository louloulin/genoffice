<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, sans-serif">
  <!-- Background -->
  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="48" fill="#2d6cdf"/>
  <text x="20" y="32" fill="#fff" font-size="18" font-weight="600">GenOffice SDK — Multi-instance Demo</text>

  <!-- Status bar -->
  <rect x="20" y="68" width="680" height="28" fill="#eef" rx="4"/>
  <text x="32" y="86" fill="#333" font-size="12" font-family="ui-monospace, monospace">2 editors live: split-left, split-right</text>

  <!-- Editor A frame -->
  <g transform="translate(20, 116)">
    <text x="0" y="-4" fill="#666" font-size="14" font-weight="600">Editor A  (split-left)</text>
    <rect x="0" y="8" width="320" height="180" fill="#fff" stroke="#ddd" rx="6"/>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#eee"/>
    <text x="12" y="28" fill="#444" font-size="12">document: doc_alpha</text>
    <rect x="40" y="64" width="240" height="20" fill="#f5f5f5" stroke="#ddd" rx="3"/>
    <text x="50" y="78" fill="#666" font-size="10" font-family="ui-monospace, monospace">Some text in doc A…</text>
    <rect x="40" y="100" width="180" height="14" fill="#f5f5f5" stroke="#ddd" rx="3"/>
    <!-- Buttons -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="60" height="22" fill="#555" rx="4"/>
      <text x="30" y="15" fill="#fff" font-size="11" text-anchor="middle">Save</text>
      <rect x="70" y="0" width="68" height="22" fill="#555" rx="4"/>
      <text x="104" y="15" fill="#fff" font-size="11" text-anchor="middle">isDirty</text>
      <rect x="148" y="0" width="70" height="22" fill="#c0392b" rx="4"/>
      <text x="183" y="15" fill="#fff" font-size="11" text-anchor="middle">Destroy</text>
    </g>
  </g>

  <!-- Editor B frame -->
  <g transform="translate(380, 116)">
    <text x="0" y="-4" fill="#666" font-size="14" font-weight="600">Editor B  (split-right)</text>
    <rect x="0" y="8" width="320" height="180" fill="#fff" stroke="#ddd" rx="6"/>
    <line x1="0" y1="40" x2="320" y2="40" stroke="#eee"/>
    <text x="12" y="28" fill="#444" font-size="12">document: doc_beta</text>
    <rect x="40" y="64" width="200" height="20" fill="#f5f5f5" stroke="#ddd" rx="3"/>
    <text x="50" y="78" fill="#666" font-size="10" font-family="ui-monospace, monospace">Translation source…</text>
    <rect x="40" y="100" width="240" height="14" fill="#f5f5f5" stroke="#ddd" rx="3"/>
    <!-- Buttons -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="60" height="22" fill="#555" rx="4"/>
      <text x="30" y="15" fill="#fff" font-size="11" text-anchor="middle">Save</text>
      <rect x="70" y="0" width="68" height="22" fill="#555" rx="4"/>
      <text x="104" y="15" fill="#fff" font-size="11" text-anchor="middle">isDirty</text>
      <rect x="148" y="0" width="70" height="22" fill="#c0392b" rx="4"/>
      <text x="183" y="15" fill="#fff" font-size="11" text-anchor="middle">Destroy</text>
    </g>
  </g>

  <!-- Shared log -->
  <g transform="translate(20, 332)">
    <text x="0" y="0" fill="#666" font-size="11" font-family="ui-monospace, monospace">[saved] instanceId=split-left  v=42</text>
    <text x="0" y="14" fill="#666" font-size="11" font-family="ui-monospace, monospace">[saved] instanceId=split-right v=17</text>
    <text x="0" y="28" fill="#666" font-size="11" font-family="ui-monospace, monospace">[dirtyChanged] instanceId=split-right dirty=true</text>
  </g>
</svg>
